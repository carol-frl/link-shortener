<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Link Shortener</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #eee; box-shadow: 0 0 10px rgba(0,0,0,.1); }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .flash { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        .result { background-color: #e2f0e0; border: 1px solid #c3e6cb; padding: 15px; border-radius: 4px; margin-top: 20px; }
        .result input { background: #fff; border: 1px dashed #ccc; cursor: pointer; }
        .copy-btn { margin-left: 10px; background-color: #28a745; }
        .copy-btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h1>Mini Link Shortener</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flashes">
            {% for message in messages %}
                <li class="flash">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="post">
        <div>
            <label for="original_url">Enter your long URL here:</label>
            <input type="text" id="original_url" name="original_url" required placeholder="e.g., https://very-long-website.com/some/path/to/content">
        </div>
        <div>
            <button type="submit">Shorten</button>
        </div>
    </form>

    {% if short_url %}
        <div class="result">
            <p>Your short URL:</p>
            <input type="text" value="{{ short_url }}" id="shortUrlDisplay" readonly onclick="this.select(); document.execCommand('copy');">
            <button onclick="copyToClipboard()" class="copy-btn">Copy</button>
        </div>
    {% endif %}

    <script>
        function copyToClipboard() {
            var copyText = document.getElementById("shortUrlDisplay");
            copyText.select();
            copyText.setSelectionRange(0, 99999); /* For mobile devices */
            document.execCommand("copy");
            alert("Copied the text: " + copyText.value);
        }
    </script>
</body>
</html>
